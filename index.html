<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6C5CE7" />
    <meta name="description" content="منصة ألعاب نقلة الإلكترونية التفاعلية 🎮 - ألعاب تعليمية وثقافية تفاعلية عالمية لجميع المراحل والأعمار مع الذكاء الاصطناعي والتراث الموسيقي." />
    
    <title>منصة ألعاب نقلة الإلكترونية التفاعلية 🎮 | NAQLA</title>

    <!-- الأيقونات المحسنة من الشعار الجديد لتبويب المتصفح والجوال -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- إعدادات تطبيق الجوال المستقل (PWA) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ألعاب نقلة" />

    <!-- الخطوط الحديثة والمريحة للقراءة -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700;800;900&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="font-sans antialiased select-none overflow-x-hidden bg-[#FFF9F2]">
    <div id="root">
      <!-- Instant pre-React loading splash to eliminate White Screen on mobile -->
      <div id="pre-react-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FFF9F2; font-family: 'Tajawal', sans-serif; text-align: center; padding: 20px;">
        <div style="width: 84px; height: 84px; border-radius: 28px; background: #FFFFFF; border: 4px solid #F59E0B; box-shadow: 0 8px 0 0 #D97706; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; animation: bounce 1.4s infinite ease-in-out;">
          <span style="font-size: 42px;">🎮</span>
        </div>
        <h1 style="color: #1F2937; font-size: 22px; font-weight: 900; margin: 0 0 8px 0;">منصة ألعاب نقلة التفاعلية</h1>
        <p style="color: #6B7280; font-size: 14px; font-weight: 700; margin: 0 0 20px 0;">جاري تجهيز الألعاب الممتعة للأبطال... 🌟</p>
        <div style="display: flex; gap: 8px;">
          <div style="width: 12px; height: 12px; border-radius: 50%; background: #6C5CE7; animation: pulse 1s infinite alternate;"></div>
          <div style="width: 12px; height: 12px; border-radius: 50%; background: #1DD1A1; animation: pulse 1s infinite alternate 0.2s;"></div>
          <div style="width: 12px; height: 12px; border-radius: 50%; background: #FF6B6B; animation: pulse 1s infinite alternate 0.4s;"></div>
          <div style="width: 12px; height: 12px; border-radius: 50%; background: #FECA57; animation: pulse 1s infinite alternate 0.6s;"></div>
        </div>
        <noscript>
          <div style="margin-top: 25px; padding: 15px; background: #FEE2E2; border: 2px solid #EF4444; border-radius: 16px; color: #991B1B; font-weight: bold; max-width: 320px;">
            ⚠️ يُرجى تفعيل الجافاسكريبت (JavaScript) في متصفحك لتشغيل منصة ألعاب نقلة.
          </div>
        </noscript>
      </div>
      <style>
        @keyframes bounce {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
        }
        @keyframes pulse {
          0% { transform: scale(0.8); opacity: 0.5; }
          100% { transform: scale(1.3); opacity: 1; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
